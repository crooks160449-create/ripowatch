<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RepoWatch{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .file-tree-item:hover { background-color: rgba(255,255,255,0.05); }
        .file-tree-item.active { background-color: rgba(59,130,246,0.15); }
        .code-header { border-bottom: 1px solid #30363d; }
        .hljs { background: #0d1117 !important; padding: 16px !important; border-radius: 0 0 6px 6px; }
        pre { margin: 0; }
        .line-numbers { counter-reset: line; }
        .line-numbers code .line { counter-increment: line; }
        .line-numbers code .line::before {
            content: counter(line);
            display: inline-block; width: 3rem; text-align: right;
            padding-right: 1rem; margin-right: 1rem;
            color: #484f58; border-right: 1px solid #21262d;
            user-select: none;
        }
    </style>
</head>
<body class="h-full bg-[#0d1117] text-gray-100">
    <!-- Nav -->
    <nav class="bg-[#161b22] border-b border-[#30363d] px-4 py-2.5 flex items-center gap-4">
        <a href="/" class="flex items-center gap-2 text-white font-semibold text-lg no-underline hover:text-blue-400 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            RepoWatch
        </a>
        {% block nav_extra %}{% endblock %}
        <div class="ml-auto flex items-center gap-3 text-sm text-gray-400">
            <span id="sync-status" class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
                实时监听中
            </span>
        </div>
    </nav>

    <!-- Content -->
    <main class="h-[calc(100%-49px)]">
        {% block content %}{% endblock %}
    </main>

    <script>
        // SSE connection for real-time notifications
        (function() {
            var statusEl = document.getElementById('sync-status');
            var evtSource = new EventSource('/events');
            evtSource.onmessage = function(e) {
                try {
                    var msg = JSON.parse(e.data);
                    if (msg.type === 'commit') {
                        // Flash the status indicator
                        if (statusEl) {
                            var dot = statusEl.querySelector('span');
                            if (dot) {
                                dot.className = 'w-2 h-2 rounded-full bg-yellow-400 inline-block';
                                setTimeout(function() { dot.className = 'w-2 h-2 rounded-full bg-green-500 inline-block'; }, 2000);
                            }
                            statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-yellow-400 inline-block"></span> 已同步: ' + (msg.data.message || '');
                            setTimeout(function() {
                                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span> 实时监听中';
                            }, 3000);
                        }
                        // Reload current page to reflect changes
                        if (!document.querySelector('.code-viewer')) {
                            setTimeout(function() { location.reload(); }, 1000);
                        }
                    }
                } catch(e) {}
            };
            evtSource.onerror = function() {
                if (statusEl) {
                    var dot = statusEl.querySelector('span');
                    if (dot) dot.className = 'w-2 h-2 rounded-full bg-red-500 inline-block';
                    statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> 连接断开';
                }
            };
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
