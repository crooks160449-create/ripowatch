hooks:
  - hooks/pptx_converter.py

site_name: RepoWatch 课程资源平台
site_description: 课程代码仓库实时追踪与可视化教学平台
site_author: RepoWatch Team

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      fallback_to_build_date: true
      type: datetime
      enable_creation_date: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 课程概述与环境搭建:
    - 课程介绍: 01-课程概述与环境搭建/课程介绍.md
    - 环境安装指南: 01-课程概述与环境搭建/环境安装指南.md
    - 环境验证脚本: 01-课程概述与环境搭建/demo_install.py
  - Python 基础语法:
    - 变量与数据类型: 02-Python基础语法/变量与数据类型.md
    - 条件判断与循环: 02-Python基础语法/条件判断与循环.md
    - 函数与模块: 02-Python基础语法/函数与模块.md
    - 课堂案例代码: 02-Python基础语法/课堂案例.py
    - 面向对象编程: 02-Python基础语法/面向对象编程.md
    - 文件操作与异常处理: 02-Python基础语法/文件操作与异常处理.md
    - 常用标准库: 02-Python基础语法/常用标准库.md
    - 课堂案例代码: 02-Python基础语法/课堂案例.py
    - 作业模板: 02-Python基础语法/作业模板.py
  - 进阶项目实操:
    - 实战项目介绍: 03-进阶项目实操/项目介绍.md
  - 资源下载:
    - 课件在线预览: 资源下载/课程课件.md
    - 课件下载: 资源下载/课件下载.md

extra:
  generator: false

