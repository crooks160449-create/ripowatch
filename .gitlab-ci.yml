# ============================================================
# 清华 Git 自动部署配置
# push 到 main 分支后，Runner 自动重建并重启课程网站
# ============================================================

stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - course-server
  image: docker:27
  script:
    - echo "开始自动部署课程网站..."
    - docker compose up -d --build
    - echo "部署完成"
  only:
    - main
