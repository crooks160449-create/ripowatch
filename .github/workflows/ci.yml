# MkDocs 自动部署到 GitHub Pages

name: 部署课程网站
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 LibreOffice（PPTX 转高清图片）
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install mkdocs mkdocs-material \
            mkdocs-git-revision-date-localized-plugin \
            pymdown-extensions python-pptx Pillow

      - name: 构建网站
        run: mkdocs build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
